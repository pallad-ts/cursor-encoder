name: Release

on:
  push:
    branches:
      - master
    paths:
      - "package/**"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_repository:
    name: Verify repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run lint
        run: yarn lint

      - name: Run tests
        run: yarn test

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - verify_repository
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Publish public workspaces
        shell: bash
        run: |
          yarn workspaces foreach -A -t --no-private exec bash -lc '
            set -euo pipefail

            PKG_NAME=$(node -p "require(\"./package.json\").name")
            PKG_VERSION=$(node -p "require(\"./package.json\").version")
            PACKAGE_ID="${PKG_NAME}@${PKG_VERSION}"
            PUBLISHED_VERSION=$(npm view "${PACKAGE_ID}" version 2>/dev/null || true)

            if [[ -n "${PUBLISHED_VERSION}" ]]; then
              echo "Skipping ${PACKAGE_ID} (already published)"
            else
              echo "Publishing ${PACKAGE_ID}"
              npm publish --provenance
            fi
          '
