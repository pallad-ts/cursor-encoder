name: Release

on:
  push:
    branches:
      - master
    paths:
      - "package/**"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_repository:
    name: Verify repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run lint
        run: yarn lint

      - name: Run tests
        run: yarn test

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - verify_repository
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Publish public workspaces
        shell: bash
        run: |
          yarn workspaces foreach -A -t --no-private exec bash -lc '
            set -euo pipefail

            PKG_NAME=$(node -p "require(\"./package.json\").name")
            PKG_VERSION=$(node -p "require(\"./package.json\").version")
            PACKAGE_ID="${PKG_NAME}@${PKG_VERSION}"

            DEPENDENCY_SPECS=$(node -e "const pkg=require(\"./package.json\"); const deps={...(pkg.dependencies||{}), ...(pkg.optionalDependencies||{})}; for (const [name, range] of Object.entries(deps)) { if (/^(workspace:|file:|link:|portal:|patch:|git\\+|https?:)/.test(range)) continue; process.stdout.write(`${name}@${range}\\n`); }")

            if [[ -n "${DEPENDENCY_SPECS}" ]]; then
              while IFS= read -r DEP_SPEC; do
                if [[ -z "${DEP_SPEC}" ]]; then
                  continue
                fi

                for ATTEMPT in {1..24}; do
                  if npm view "${DEP_SPEC}" version >/dev/null 2>&1; then
                    break
                  fi

                  if [[ "${ATTEMPT}" -eq 24 ]]; then
                    echo "Dependency ${DEP_SPEC} is not available on npm" >&2
                    exit 1
                  fi

                  sleep 5
                done
              done <<< "${DEPENDENCY_SPECS}"
            fi

            if npm view "${PACKAGE_ID}" version >/dev/null 2>&1; then
              echo "Skipping ${PACKAGE_ID} (already published)"
            else
              echo "Publishing ${PACKAGE_ID}"
              npm publish --provenance
            fi
          '
